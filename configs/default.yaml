# silent-speech-jaw: every option with its default value.
#
# Pass a file with only the options you want to change:
#     ssj train --data data/processed --out runs/x -c my.yaml
# or override single options on the command line:
#     ssj train ... -s train.epochs=200 -s model.d_model=160
#
# Sections and the commands that read them:
#     dataset   ssj data build, ssj record (front-end and segmenter)
#     model, train, augment   ssj train
#     adapt     ssj adapt
#     recorder, qc            ssj record
#     pipeline  ssj eval, ssj tune, ssj decode, ssj live
#
# Changing anything under dataset.frontend changes the features and therefore
# the front-end fingerprint: datasets must be rebuilt and models retrained.
#
# Generated by tools/write_default_config.py - do not edit by hand.

dataset:
  frontend:
    fs: 100.0
    oversample: 2
    lowpass_hz: 30.0
    hf_highpass_hz: 45.0
    hf_smooth_hz: 12.0
    hf_floor_g: 0.002
    max_gap_s: 0.1
    smooth_fifo_timestamps: true
    gyro_scale_dps: 50.0
    accel_scale_g: 0.1
    angle_scale_deg: 5.0
    noise_gyro_dps: 0.6
    noise_accel_g: 0.006
    activity_tau_s: 0.04
    still_z: 1.6
    tilt_z: 3.0
    rest_hold_s: 0.4
    long_still_s: 3.0
    baseline_tau_s: 1.0
    bias_tau_s: 4.0
    bias_gate_dps: 2.0
    angle_rest_tau_s: 0.3
    warmup_s: 1.0
  segmenter:
    start_z: 3.0
    end_z: 1.6
    start_frames: 3
    end_quiet_s: 0.7
    pre_roll_s: 0.25
    post_roll_s: 0.2
    min_duration_s: 0.25
    max_duration_s: 12.0
    cooldown_s: 0.2
  trim: true
  min_frames: 15
  max_frames: 1600
  frames_per_label: 4.0
  test_sessions: []
  val_sessions: []
  holdout: last
  within_session_val: 0.1
model:
  streams: [jaw, ref, rel, env]
  stem_channels: 24
  d_model: 128
  tcn_dilations: [1, 2, 4, 8, 1, 2]
  tcn_kernel: 5
  gru_layers: 2
  gru_hidden: 128
  dropout: 0.2
  subsample: 2
  intermediate_ctc: true
  session_adapters: true
  adapter_dropout: 0.3
train:
  epochs: 120
  batch_size: 24
  lr: 0.003
  weight_decay: 0.01
  warmup_steps: 150
  curriculum_epochs: 2
  min_lr_ratio: 0.05
  grad_clip: 5.0
  coarse_weight: 0.3
  inter_weight: 0.3
  adapter_l2: 0.01
  patience: 25
  seed: 42
  device: auto
  threads: 0
  shuffle_labels: false
augment:
  enabled: true
  rate_range: [0.82, 1.22]
  gain_range: [0.85, 1.18]
  rotation_deg: 6.0
  head_motion_prob: 0.5
  head_rate_dps: [2.0, 25.0]
  noise_std: 0.03
  drift_prob: 0.3
  time_masks: 2
  time_mask_frames: 6
  stream_dropout: 0.05
  concat_prob: 0.15
adapt:
  epochs: 40
  batch_size: 16
  lr: 0.005
  adapter_l2: 0.01
  coarse_weight: 0.3
  seed: 0
  holdout: 0.2
recorder:
  pre_rest_s: 1.0
  post_rest_s: 0.6
  base_window_s: 0.9
  per_phoneme_s: 0.17
  min_window_s: 1.6
  max_window_s: 10.0
  lead_margin_s: 0.3
  tail_margin_s: 0.4
  calib_rest_s: 3.0
  calib_head_s: 6.0
  calib_jaw_s: 6.0
  auto: false
  max_retries: 2
qc:
  min_rate_fraction: 0.8
  max_loss: 0.05
  max_gap_ms: 120.0
  min_active_s: 0.15
  early_margin_s: 0.08
  late_margin_s: 0.05
  max_head_rate_dps: 60.0
pipeline:
  lexicon: ''
  lm: ''
  beam:
    beam_size: 300
    beam_threshold: 22.0
    token_beam: 9.0
    max_tokens: 8
    blank_skip: 0.9995
    lm_weight: 0.9
    word_bonus: 1.0
    nbest: 40
  fusion:
    tau: 0.5
    w_am: 1.0
    w_ngram: 0.4
    w_llm: 0.6
    w_words: 1.0
    rescore_top: 12
    lattice_paths: 6
    lattice_proposal: true
    free_proposal: true
    max_alternatives: 6
    confidence_scale: 0.5
    min_confidence: 0.0
    min_frame_score: -4.0
  llm:
    model: ''
    n_ctx: 1024
    n_threads: 0
    n_gpu_layers: 0
    seed: 0
  segmenter:
    start_z: 3.0
    end_z: 1.6
    start_frames: 3
    end_quiet_s: 0.7
    pre_roll_s: 0.25
    post_roll_s: 0.2
    min_duration_s: 0.25
    max_duration_s: 12.0
    cooldown_s: 0.2
  threads: 1
  history: 4
