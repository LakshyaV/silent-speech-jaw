name: Feature or improvement
description: Propose a change to the pipeline, firmware or tooling
labels: ["type: feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible that is not today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed design
      description: Interfaces, algorithms, alternatives considered.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it works? Prefer checks against simulator ground truth or held-out sessions.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [firmware, io, dsp, sim, collect, data, model, decode, llm, eval, runtime, app, infra, docs]
    validations:
      required: true
