name: Bug report
description: Something does not behave as documented
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and its output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: |
        Board and sensors, firmware options (FIFO or polled, data rate, transport),
        output of `ssj monitor`, `ssj --version`, operating system and Python version.
    validations:
      required: true
  - type: textarea
    id: session
    attributes:
      label: Session details
      description: For recognition problems, the calibration level reported by `ssj data info` and whether the session was used in training.
