[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "silent-speech-jaw"
version = "0.1.0"
description = "Open-vocabulary silent speech from a dual jaw/reference IMU: phoneme CTC recognition, lexicon decoding and local quantized-LLM sentence reconstruction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lakshya Vasudeva" }]
keywords = ["silent speech", "IMU", "phoneme recognition", "CTC", "llama.cpp", "wearable"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Host-side acquisition over USB serial.
serial = ["pyserial>=3.5"]
# Training and ONNX export of the phoneme recogniser.
train = ["torch>=2.2", "onnx>=1.16"]
# Portable inference of exported bundles.
runtime = ["onnxruntime>=1.17"]
# Local quantized LLM (GGUF) for sentence reconstruction.
llm = ["llama-cpp-python>=0.3.2"]
dev = ["pytest>=8.0", "ruff==0.17.6"]
all = ["silent-speech-jaw[serial,train,runtime,llm,dev]"]

[project.scripts]
ssj = "ssj.cli:main"

[project.urls]
Repository = "https://github.com/LakshyaV/silent-speech-jaw"
Issues = "https://github.com/LakshyaV/silent-speech-jaw/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ssj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: end-to-end tests that train a small model",
  "llm: tests that need a local GGUF model (set SSJ_TEST_GGUF)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
  "E501",   # line length is handled by the formatter
  "E741",   # l / I / O are conventional names in the maths-heavy modules
  "B905",   # zip() strictness is checked by shape asserts where it matters
  "SIM108", # ternaries are not always clearer
  "SIM905", # word lists read better as split strings
  "RUF001", # unicode symbols are intentional in user-facing strings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
